<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dental Clinic — 24/7 AI Assistant</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    #log { border: 1px solid #ccc; border-radius: 8px; min-height: 300px; padding: 1rem; margin-bottom: 1rem; }
    .user { text-align: right; margin: 0.5rem 0; }
    .bot { text-align: left; margin: 0.5rem 0; color: #1a4d2e; }
    form { display: flex; gap: 0.5rem; }
    input { flex: 1; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <h1>Dental Clinic — 24/7 AI Assistant</h1>
  <p>Check open slots, book, or cancel appointments. Clinic hours 09:00–17:00 (Manila).</p>
  <div id="log"></div>
  <form id="chat">
    <input id="msg" autocomplete="off" placeholder="Book cleaning tomorrow 10:00, name Ana 09170000001" />
    <button type="submit">Send</button>
  </form>
  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('chat');
    const input = document.getElementById('msg');
    let sessionId = localStorage.getItem('dental-session');
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      localStorage.setItem('dental-session', sessionId);
    }
    function add(text, cls) {
      const div = document.createElement('div');
      div.className = cls;
      div.textContent = text;
      log.appendChild(div);
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      add(message, 'user');
      input.value = '';
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ message, sessionId }),
        });
        const data = await res.json();
        add(data.reply ?? data.error ?? 'Sorry, something went wrong.', 'bot');
      } catch {
        add('Network error — please try again.', 'bot');
      }
    });
  </script>
</body>
</html>
